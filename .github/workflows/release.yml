name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the same gate main gets: a tag that cannot pass validation must not become a release
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draft notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # fails when the tag has no changelog section, so notes can never be invented here
          bash scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_ENV"

      # gh ships on the runner, so no third-party action handles the release token
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already exists; updating its notes"
            gh release edit "$GITHUB_REF_NAME" \
              --title "Silere Shell $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Silere Shell $version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
