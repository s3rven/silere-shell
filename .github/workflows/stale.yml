name: Stale

on:
  schedule:
    # weekly, so each 6-day limit below lands on the next run; only needs-info issues are touched
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  needs-info:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # pinned to an immutable sha so a moved tag cannot run unreviewed code
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs-info
          exempt-issue-labels: bug,enhancement,documentation,help wanted
          days-before-issue-stale: 6
          days-before-issue-close: 6
          remove-issue-stale-when-updated: true
          stale-issue-label: stale
          close-issue-reason: not_planned
          stale-issue-message: >
            This is still waiting on the details asked for above. It closes in
            seven days without them. Adding a comment keeps it open.
          close-issue-message: >
            Closing since the details needed to reproduce this never arrived.
            Comment with them and it reopens.
          # pull requests are reviewed by hand, never swept
          days-before-pr-stale: -1
          days-before-pr-close: -1
          operations-per-run: 60
