name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rolling-Arch probe catches upstream Quickshell compatibility drift.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15

    steps:
      - name: Install validation dependencies
        run: pacman -Syu --noconfirm git shellcheck quickshell

      # pinned to an immutable sha so a moved tag cannot run unreviewed code
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Structural and portability validation
        run: SILERE_REQUIRE_GIT_TESTS=1 bash scripts/ci-lint.sh

      - name: Quickshell package compatibility
        shell: bash
        run: |
          set -euo pipefail
          qs --version
          source scripts/lib/qml-modules.sh
          for module in "${SILERE_REQUIRED_QML_MODULES[@]}"; do
            _qml_module_available "$module" || {
              echo "::error::required QML module is missing: $module"
              exit 1
            }
            echo "ok: $module"
          done

      - name: Headless QML import and type probe
        run: SILERE_REQUIRE_QML_TOOLS=1 bash scripts/test-qml-headless.sh
