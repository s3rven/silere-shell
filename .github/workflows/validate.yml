name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rolling-Arch probe catches upstream Quickshell compatibility drift.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Literal prefix, never ${{ github.workflow }}: a called workflow resolves that to
# the caller's name, and a group shared with the caller deadlocks the run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15

    steps:
      - name: Install validation dependencies
        run: |
          pacman -Syu --noconfirm git openssh shellcheck quickshell python fontconfig ttf-jetbrains-mono-nerd actionlint
          fc-cache -f >/dev/null

      # pinned to an immutable sha so a moved tag cannot run unreviewed code
      # fetch-depth 0 also gets the tags: the lint compares the AUR pkgver against
      # the newest local tag, and checkout's default is one commit and no tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # the job runs as root over a workspace owned by the runner's uid, so without this
      # git refuses to read the repository and every index-backed lint sees an empty list
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # tag runs only: a branch or pull request has no release to gate
      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          git -c safe.directory="$PWD"
          -c gpg.format=ssh
          -c gpg.ssh.allowedSignersFile="$PWD/security/update-signers"
          verify-tag "$GITHUB_REF_NAME"

      - name: Match release compatibility manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' release.json)"
          test "$version" = "${GITHUB_REF_NAME#v}" || {
            echo "::error::release.json says $version; tag says ${GITHUB_REF_NAME#v}"
            exit 1
          }

      # shell: bash sets pipefail, so the tee cannot hide a failing suite
      - name: Structural and portability validation
        shell: bash
        run: SILERE_REQUIRE_GIT_TESTS=1 SILERE_REQUIRE_TOOLS=1 bash scripts/ci-lint.sh 2>&1 | tee /tmp/count-lint.log

      - name: Quickshell package compatibility
        shell: bash
        run: |
          set -euo pipefail
          qs --version
          source scripts/lib/qml-modules.sh
          for module in "${SILERE_REQUIRED_QML_MODULES[@]}"; do
            _qml_module_available "$module" || {
              echo "::error::required QML module is missing: $module"
              exit 1
            }
            echo "ok: $module"
          done

      - name: Headless QML import and type probe
        shell: bash
        run: SILERE_REQUIRE_QML_TOOLS=1 bash scripts/test-qml-headless.sh 2>&1 | tee /tmp/count-types.log

      - name: Behavioral logic probe
        shell: bash
        run: bash scripts/test-logic.sh 2>&1 | tee /tmp/count-logic.log

      - name: Settings surface build probe
        # offscreen QPA needs no display; catches runtime-only errors in the
        # lazily-loaded settings pages that qmlcachegen and qmllint cannot see
        run: bash scripts/test-surfaces.sh

      - name: Live settings change sweep
        # drives the whole schema against surfaces that already exist; the passes
        # above only ever fix the settings before a surface is built
        shell: bash
        run: bash scripts/test-mutate.sh 2>&1 | tee /tmp/count-sweep.log

      - name: Settings layout fit probe
        # a section can build and still lose its labels; Qt elides and reports success
        env:
          FIT_REQUIRE_FONT: "1"
        run: bash scripts/test-layout-fit.sh

      # the README badge reads this notice back through the API; see badge.yml
      - name: Count the checks
        shell: bash
        run: |
          lint="$(grep -c '^ok ' /tmp/count-lint.log || true)"
          types="$(grep -oE 'type-check passed \([0-9]+ files\)' /tmp/count-types.log | grep -oE '[0-9]+' | tail -n1 || true)"
          logic="$(grep -oE 'PROBE-LOGIC passed [0-9]+' /tmp/count-logic.log | grep -oE '[0-9]+$' | tail -n1 || true)"
          sweep="$(grep -oE 'PROBE-MUTATE swept [0-9]+' /tmp/count-sweep.log | grep -oE '[0-9]+$' | tail -n1 || true)"
          total=$(( ${lint:-0} + ${types:-0} + ${logic:-0} + ${sweep:-0} ))
          echo "lint $lint, types $types, logic $logic, sweep $sweep"
          echo "::notice title=Check count::$total"
