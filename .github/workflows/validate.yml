name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rolling-Arch probe catches upstream Quickshell compatibility drift.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Literal prefix, never ${{ github.workflow }}: a called workflow resolves that to
# the caller's name, and a group shared with the caller deadlocks the run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-quickshell:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 30
    steps:
      - name: Install build and probe dependencies
        # The minimum runtime needs a compatible Qt too; 0.3.1 does not build on Qt 6.12.
        # This snapshot supplies Qt 6.9.2 and checks the documented Qt 6.9 floor.
        run: |
          # shellcheck disable=SC2016
          printf 'Server = https://archive.archlinux.org/repos/2025/10/01/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          # today's keyring has disabled keys that signed this snapshot, so rebuild it from
          # the snapshot's own. Only this one package skips the check; the rest are verified
          cp /etc/pacman.conf /tmp/pacman.conf.verified
          sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf
          pacman -Syy --noconfirm archlinux-keyring
          cp /tmp/pacman.conf.verified /etc/pacman.conf
          rm -rf /etc/pacman.d/gnupg
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syyuu --noconfirm --overwrite '*' --ignore archlinux-keyring git cmake ninja gcc pkgconf cli11 qt6-declarative qt6-shadertools qt6-wayland qt6-svg libdrm pipewire wayland wayland-protocols vulkan-headers fontconfig ttf-jetbrains-mono-nerd
          test "$(pacman -Q qt6-base)" = 'qt6-base 6.9.2-1'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the minimum supported Quickshell
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/quickshell-mirror/quickshell.git /tmp/minimum-quickshell
          test "$(git -C /tmp/minimum-quickshell rev-parse HEAD)" = 1a4716cde794a59928d9d9fc15f2afc7a95de360
          cmake -S /tmp/minimum-quickshell -B /tmp/minimum-quickshell/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/minimum-quickshell -DINSTALL_QML_PREFIX=qml -DCRASH_HANDLER=OFF -DUSE_JEMALLOC=OFF -DSERVICE_PAM=OFF -DSERVICE_POLKIT=OFF
          cmake --build /tmp/minimum-quickshell/build --parallel 4
          cmake --install /tmp/minimum-quickshell/build
      - name: Check QML and behavior against the minimum runtime
        env:
          PATH: /opt/minimum-quickshell/bin:/usr/local/sbin:/usr/local/bin:/usr/bin
          QML2_IMPORT_PATH: /opt/minimum-quickshell/qml
          SILERE_REQUIRE_QML_TOOLS: "1"
        run: |
          qs --version
          bash scripts/test-qml-headless.sh
          bash dev/test-logic.sh

  compositor-integration:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compositor: [kwin, hyprland, niri]
    steps:
      - name: Install compositor test dependencies
        run: |
          pacman -Syu --noconfirm git quickshell kwin libkscreen dbus mesa libglvnd niri hyprland fontconfig ttf-jetbrains-mono-nerd util-linux
          # a file capability cannot be exec'd without privileges, and this container has none to give
          setcap -r "$(command -v kwin_wayland)"
          useradd --create-home silere-test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise isolated compositor sessions
        env:
          SILERE_TEST_COMPOSITOR: ${{ matrix.compositor }}
        run: runuser -u silere-test -- bash dev/test-compositors.sh "$SILERE_TEST_COMPOSITOR"
      - name: Exercise output removal
        if: matrix.compositor == 'kwin'
        run: runuser -u silere-test -- bash dev/test-screens.sh

  validate:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15

    steps:
      - name: Install validation dependencies
        run: |
          pacman -Syu --noconfirm git openssh shellcheck quickshell python fontconfig ttf-jetbrains-mono-nerd actionlint util-linux
          fc-cache -f >/dev/null

      # pinned to an immutable sha so a moved tag cannot run unreviewed code
      # fetch-depth 0 also gets the tags: the lint compares the AUR pkgver against
      # the newest local tag, and checkout's default is one commit and no tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # the job runs as root over a workspace owned by the runner's uid, so without this
      # git refuses to read the repository and every index-backed lint sees an empty list
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # tag runs only: a branch or pull request has no release to gate
      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "::error::release tag is not on origin/main"
            exit 1
          }
          signers="$(mktemp)"
          trap 'rm -f "$signers"' EXIT
          git show refs/remotes/origin/main:security/update-signers > "$signers"
          git -c safe.directory="$PWD" -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$signers" verify-tag "$GITHUB_REF_NAME"

      - name: Match release compatibility manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' release.json)"
          test "$version" = "${GITHUB_REF_NAME#v}" || {
            echo "::error::release.json says $version; tag says ${GITHUB_REF_NAME#v}"
            exit 1
          }

      # shell: bash sets pipefail, so the tee cannot hide a failing suite
      - name: Structural and portability validation
        shell: bash
        run: SILERE_REQUIRE_GIT_TESTS=1 SILERE_REQUIRE_TOOLS=1 bash dev/ci-lint.sh 2>&1 | tee /tmp/count-lint.log

      - name: Quickshell package compatibility
        shell: bash
        run: |
          set -euo pipefail
          qs --version
          source scripts/lib/qml-modules.sh
          for module in "${SILERE_REQUIRED_QML_MODULES[@]}"; do
            _qml_module_available "$module" || {
              echo "::error::required QML module is missing: $module"
              exit 1
            }
            echo "ok: $module"
          done

      - name: Headless QML import and type probe
        shell: bash
        run: SILERE_REQUIRE_QML_TOOLS=1 bash scripts/test-qml-headless.sh 2>&1 | tee /tmp/count-types.log

      - name: Behavioral logic probe
        shell: bash
        run: bash dev/test-logic.sh 2>&1 | tee /tmp/count-logic.log

      - name: Extended UI interaction stress
        shell: bash
        run: bash dev/test-ui-stress.sh

      - name: Settings surface build probe
        # offscreen QPA needs no display; catches runtime-only errors in the
        # lazily-loaded settings pages that qmlcachegen and qmllint cannot see
        run: bash dev/test-surfaces.sh

      - name: Live settings change sweep
        # drives the whole schema against surfaces that already exist; the passes
        # above only ever fix the settings before a surface is built
        shell: bash
        run: bash dev/test-mutate.sh 2>&1 | tee /tmp/count-sweep.log

      - name: Settings layout fit probe
        # a section can build and still lose its labels; Qt elides and reports success
        env:
          FIT_REQUIRE_FONT: "1"
        run: bash dev/test-layout-fit.sh

      # the README badge reads this notice back through the API; see badge.yml
      - name: Count the checks
        shell: bash
        run: |
          lint="$(grep -c '^ok ' /tmp/count-lint.log || true)"
          types="$(grep -oE 'type-check passed \([0-9]+ files\)' /tmp/count-types.log | grep -oE '[0-9]+' | tail -n1 || true)"
          logic="$(grep -oE 'PROBE-LOGIC passed [0-9]+' /tmp/count-logic.log | grep -oE '[0-9]+$' | tail -n1 || true)"
          sweep="$(grep -oE 'PROBE-MUTATE swept [0-9]+' /tmp/count-sweep.log | grep -oE '[0-9]+$' | tail -n1 || true)"
          total=$(( ${lint:-0} + ${types:-0} + ${logic:-0} + ${sweep:-0} ))
          echo "lint $lint, types $types, logic $logic, sweep $sweep"
          echo "::notice title=Check count::$total"
