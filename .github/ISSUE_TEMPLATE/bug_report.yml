name: Bug report
description: Report broken behavior, a regression, or a compatibility problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Include enough detail to reproduce the problem. Remove user names, window titles, network names and other private information from logs.

        `silere doctor` checks your setup, and `silere version` prints the installed version.

  - type: input
    id: silere
    attributes:
      label: Silere version
      description: The output of `silere version`, or the package version.
      placeholder: Silere Shell v1.10.0 (#92c33530)
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution
      description: Distribution name and version, including whether it is Arch-based.
      placeholder: Arch Linux, Debian sid, Fedora 43...
    validations:
      required: true

  - type: input
    id: quickshell
    attributes:
      label: Quickshell version
      description: Output from `qs --version` and how Quickshell was installed.
      placeholder: 0.3.2 from distro package
    validations:
      required: true

  - type: input
    id: compositor
    attributes:
      label: Compositor version
      description: Hyprland or niri version, and how it was installed.
      placeholder: Hyprland 0.57.2 or niri 26.04
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Enable...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional environment details
      description: GPU, multi-monitor layout, session setup, or anything else relevant to the problem.
      placeholder: |
        GPU: Intel Iris Xe
        Outputs: laptop at 1.5x plus an external display

  - type: textarea
    id: logs
    attributes:
      label: Runtime errors
      description: Relevant lines from `silere log`, from `journalctl --user -u silere-shell.service -b` for the user service, or a screenshot. Remove private information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested with the current `main` branch or confirmed this is still present there.
          required: true
        - label: I removed private information from logs and screenshots.
          required: true
