name: Bug report
description: Report broken behavior, a regression, or a compatibility problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Include enough environment detail to reproduce the problem. Remove usernames, window titles, network names, and other private information from logs.

        From a Silere checkout, `bash scripts/check.sh` prints the three versions below in its first block.

  - type: input
    id: silere
    attributes:
      label: Silere version
      description: Tag or commit, from `git describe --tags --always --dirty`, or the package version.
      placeholder: v0.6.1, or v0.6.1-12-gabc1234
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution
      description: Distribution name and version, including whether it is Arch-based.
      placeholder: CachyOS, Fedora 42, Ubuntu 26.04...
    validations:
      required: true

  - type: input
    id: quickshell
    attributes:
      label: Quickshell version
      description: Output from `qs --version` and how Quickshell was installed.
      placeholder: 0.3.0 from distro package
    validations:
      required: true

  - type: input
    id: compositor
    attributes:
      label: Compositor version
      description: Hyprland or niri version, including how it was installed.
      placeholder: Hyprland 0.50.1 or niri 26.02
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Enable...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional environment details
      description: GPU, multi-monitor layout, session setup, or anything else relevant to the problem.
      placeholder: |
        GPU: AMD Radeon 780M
        Outputs: laptop at 1.25x plus an external display

  - type: textarea
    id: logs
    attributes:
      label: Runtime errors
      description: Relevant output from `qs -p shell.qml`, a user-service log, or a screenshot. Remove private information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested with the current `main` branch or confirmed this is still present there.
          required: true
        - label: I removed private information from logs and screenshots.
          required: true
